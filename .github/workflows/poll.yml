name: poll-bazaar
on:
    schedule:
        - cron: "*/15 * * * *"
    workflow_dispatch: 
permissions: 
    contents: write
concurrency: 
    group: bazaar
    cancel-in-progress: false
jobs:
    poll:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/checkout@v4
              with:
                ref: data
                path: data
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: pip
            - run: pip install -r requirements.txt
            - run: python main.py
            - name: Commit data
              working-directory: data
              run: |
                git config user.name "github-actions"
                git config user.name "actions@users.noreply.github.com"
                git add -A
                git commit --amend -m "data $(data -u +%F)"
                git push --force origin data